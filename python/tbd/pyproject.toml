[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbd"
version = "0.1.0"
description = "todo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
# use src/ layout
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tbd*"]
